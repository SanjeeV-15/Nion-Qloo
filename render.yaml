# Tells Render how to run Nion (a "Blueprint"). It holds no secrets: the two API keys are
# typed into Render's own secret fields when the service is first created, never into this file.
services:
  - type: web
    name: nion
    runtime: node
    # The cheapest paid plan (it used to be called Starter). Unlike the free plan, which sleeps after 15 idle
    # minutes and takes about a minute to wake, this one stays awake for a judge's first visit.
    plan: 0.5c-512mb
    buildCommand: npm ci
    # Render has no .env file, so Node reads the settings Render provides.
    startCommand: node server/index.js
    healthCheckPath: /api/health
    # A new version goes live on every push to the branch. Before judging starts, change this to
    # "off" so a late change cannot break a working demo.
    autoDeployTrigger: commit
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: QLOO_API_KEY
        sync: false
      # The most the demo may spend (an estimate): per day (resets at midnight UTC) and in total
      # since the server last started. When either is reached Nion says it is resting.
      - key: NION_DAILY_BUDGET_USD
        value: "2"
      - key: NION_TOTAL_BUDGET_USD
        value: "8"
      # How many proxies sit between a visitor and the server, so each visitor's address can be read.
      # Measured on Render with /api/whoami (NION_IP_DEBUG=1): the local proxy, Render and Cloudflare, so 3.
      # (With 1, every visitor looked like Render's internal address.)
      - key: TRUST_PROXY_HOPS
        value: "3"
